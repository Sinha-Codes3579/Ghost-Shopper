version: "3.9"

services:
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./store_layout.json:/app/store_layout.json:ro
      - ./data:/app/data:ro
      - db_data:/app/db
    environment:
      - DB_PATH=/app/db/store_intelligence.db
      - POS_CSV_PATH=/app/data/pos_transactions.csv
      - STORE_LAYOUT_PATH=/app/store_layout.json
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: on-failure

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    environment:
      - API_BASE_URL=http://api:8000
      - EVENTS_JSONL=/app/data/events.jsonl
      - STORE_ID=ST1008
    profiles:
      - dashboard
    restart: on-failure

volumes:
  db_data:
